server {
    listen              0.0.0.0:8080;
    server_name         localhost;

    client_max_body_size 1m;

    error_page 404      /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    root                ./www;
    index               index.html;


    location / {
        allow_methods   GET POST DELETE;
        autoindex       off;
    }

    location /uploads {
        allow_methods   GET POST DELETE;
        autoindex       on;
        upload_store    ./www/uploads;
    }

    location /old {
        return          301 /new;
    }

    location /cgi-bin {
        allow_methods   GET POST;
        root            ./www/cgi-bin;
        cgi_extension   .py .php;
    }
}

server {
    listen              0.0.0.0:9090;
    server_name         second;
    root                ./www2;
    index               index.html;

    location / {
        allow_methods   GET;
        autoindex       on;
    }
}
