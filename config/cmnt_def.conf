server {
    listen              0.0.0.0:8080;                   # interface:port to bind
    listen              127.0.0.1:8081;
    server_name         demo.webserv;                   # human readable name

    client_max_body_size 5m;							# max allowed request body

    # Default error pages (served when no custom page is configured)
    error_page 400      /errors/400.html;
    error_page 403      /errors/403.html;
    error_page 404      /errors/404.html;
    error_page 405      /errors/405.html;
    error_page 413      /errors/413.html;
    error_page 500      /errors/500.html;
    error_page 502 503 504 /errors/50x.html;

    root                ./www/demo;						# document root
    index               index.html;						# default file for a directory

    # ---- Routes / locations ------------------------------------------------ #

    location / {
        allow_methods   GET;
        autoindex       off;
    }

    location /public {
        allow_methods   GET;
        autoindex       on;
        root            ./www/public;
        index           index.html;
    }

    location /upload {
        allow_methods   POST;
        autoindex       off;
        upload_store    ./upload;
    }

    location /old-stuff {
        allow_methods   GET;
        return          301 /public;
    }

    location /old-stuff-2 {
        allow_methods   GET;
        return          302 /public;
    }

    location /api {
        allow_methods   GET POST DELETE;
        autoindex       off;
        root            ./www/api;
        index           api.html;
    }

    location /secret {
        allow_methods   GET;
        autoindex       off;
        root            ./www/demo/secret;
    }

    location /cgi-bin/py {
        allow_methods   GET POST;
        root            ./www/cgi-bin/python;
        cgi_extension   .py;
        autoindex       off;
    }

    location /cgi-bin/php {
        allow_methods   GET POST;
        root            ./www/cgi-bin/php;
        cgi_extension   .php;
        autoindex       off;
    }
}
