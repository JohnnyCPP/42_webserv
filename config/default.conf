server {
    listen              0.0.0.0:8080;
    server_name         webserv.test;

    client_max_body_size 1m;

    error_page 403      /error_pages/403.html;
    error_page 404      /error_pages/404.html;

    root                ./www/web1;
    index               index.html;

    # Site root: serve index.html. DELETE is allowed so the delete test works.
    location / {
        allow_methods   GET POST DELETE;
        autoindex       off;
    }

    # Autoindex ON — the "/data" button shows a directory listing.
    location /data {
        allow_methods   GET DELETE;
        root            ./www/web1/data;
        autoindex       on;
    }

    # Autoindex OFF, no index file -> 403 (the "/assets" button).
    location /assets {
        allow_methods   GET;
        root            ./www/web1/assets;
        autoindex       off;
    }

    # Built-in upload (POST). Uploaded files land under /data/files.
    location /upload {
        allow_methods   POST;
        upload_store    ./www/web1/data/files;
    }

    # GET deliberately not allowed -> 405 (the "/getnotallowed" button).
    location /getnotallowed {
        allow_methods   POST;
    }

    # Redirections.
    location /redir {
        allow_methods   GET;
        return          301 /data;
    }

    location /redirexample {
        allow_methods   GET;
        return          301 http://example.com;
    }

    # CGI — wired and ready. Files are served until the CGI handler executes them.
    location /cgi/python {
        allow_methods   GET POST DELETE;
        root            ./www/web1/cgi/python;
        cgi_extension   .py;
    }

    location /cgi/php {
        allow_methods   GET POST;
        root            ./www/web1/cgi/php;
        cgi_extension   .php;
    }
}

# Second server on a different port serving different content.
# Satisfies the subject's "listen to multiple ports to deliver different content".
server {
    listen              0.0.0.0:8081;
    server_name         webserv.second;

    client_max_body_size 1m;

    root                ./www/web1/data;
    index               nonexistent.html;

    location / {
        allow_methods   GET;
        autoindex       on;
    }
}
