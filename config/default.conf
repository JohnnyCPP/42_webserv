server {
    listen              0.0.0.0:8080;       # interface:port to bind
    server_name         localhost;

    client_max_body_size 1m;                # max allowed request body

    # Default error pages (served when no custom page is configured)
    error_page 404      /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    root                ./www;              # document root
    index               index.html;         # default file for a directory

    # ---- Routes / locations ------------------------------------------------ #

    location / {
        allow_methods   GET POST DELETE;
        autoindex       off;                # directory listing on/off
    }

    location /uploads {
        allow_methods   GET POST DELETE;
        autoindex       on;
        upload_store    ./www/uploads;      # where uploaded files are saved
    }

    location /old {
        return          301 /new;           # HTTP redirection
    }

    location /cgi-bin {
        allow_methods   GET POST;
        root            ./www/cgi-bin;
        cgi_extension   .py .php;            # run matching files as CGI
    }
}

server {
    listen              0.0.0.0:9090;
    server_name         second;
    root                ./www2;
    index               index.html;

    location / {
        allow_methods   GET;
        autoindex       on;
    }
}
