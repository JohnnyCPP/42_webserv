# Dedicated configuration for the functional test suite.
# Uses isolated high ports (18080 / 19090) so the tests never collide with a
# webserv the developer may already be running on the default ports.
#
# NOTE: every "future" behaviour the eval expects (static serving, 404, 405,
# 413, autoindex, upload, redirect, custom error pages, CGI) is already
# declared here on purpose, so that the PENDING checks in run.sh exercise the
# real routing once Phase 3 (WebServer::processClientRequest) is implemented.

server {
    listen              127.0.0.1:18080;
    server_name         test.webserv;

    client_max_body_size 1m;

    error_page 404      /errors/404.html;
    error_page 405      /errors/405.html;
    error_page 413      /errors/413.html;

    root                ./www/demo;
    index               index.html;

    location / {
        allow_methods   GET;
        autoindex       off;
    }

    location /public {
        allow_methods   GET;
        autoindex       on;
        root            ./www/public;
        index           index.html;
    }

    location /upload {
        allow_methods   POST;
        autoindex       off;
        upload_store    ./uploads;
    }

    location /old-stuff {
        return          301 /public;
    }

    location /api {
        allow_methods   GET POST DELETE;
        autoindex       off;
        root            ./www/api;
        index           api.html;
    }
}

server {
    listen              127.0.0.1:19090;
    server_name         static.webserv;

    client_max_body_size 1m;

    root                ./www/static;
    index               index.html;

    location / {
        allow_methods   GET;
        autoindex       on;
    }
}
